<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CR3W City</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#06081a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --night:#06081a; --deck:#0d1130; --glass:rgba(12,16,44,.82); --glass-2:rgba(18,23,60,.9); --line:rgba(140,150,230,.22); --line-2:rgba(140,150,230,.38);
  --ink:#f1f2ff; --dim:#a3aad8; --gold:#f2c14e; --violet:#8b6cff;
  --ok:#2bd99a; --wait:#ffb547; --bad:#ff4f6d; --off:#7b82ab;
  --f-display:"Chakra Petch",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#scene.hover{cursor:pointer}
.fade{position:fixed;inset:0;z-index:15;background:#03040c;opacity:0;pointer-events:none;transition:opacity .38s ease}
.fade.on{opacity:1}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(6,8,26,.92),rgba(6,8,26,0));pointer-events:none}
.hud>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.brand img{width:30px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(242,193,78,.45))}
.brand span{color:var(--gold)}
.where{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.tag.live{color:var(--ok);border-color:rgba(43,217,154,.5)}
.tag.down{color:var(--bad);border-color:rgba(255,79,109,.6)}
.vault{margin-left:auto;font-family:var(--f-mono);font-size:13px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-variant-numeric:tabular-nums}
.vault b{color:var(--gold);font-weight:600}
.counts{display:flex;gap:6px;font-family:var(--f-mono);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.running{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.waiting{background:var(--wait);box-shadow:0 0 8px var(--wait)}
.dot.error{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.back{display:none;align-items:center;gap:6px;font:500 13px var(--f-body);color:var(--ink);background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;cursor:pointer}
body.office .back{display:inline-flex}
.back:hover{border-color:var(--gold)}

.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;font-size:13px;color:var(--dim);background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap}
.feed{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
body.office .feed{display:none}
.ev{font-family:var(--f-mono);font-size:11.5px;line-height:1.4;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:5px;padding:6px 9px}
.ev.bad{border-left-color:var(--bad)}
.ev time{color:var(--dim);margin-right:6px}
.banner{position:fixed;z-index:7;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:#3a1020;border:1px solid var(--bad);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.45}

.panel{position:fixed;z-index:6;top:calc(66px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:400px;
  background:linear-gradient(180deg,var(--glass-2),var(--glass));backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.p-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.p-eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.p-head h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:.03em;line-height:1.15}
.p-head p{margin:4px 0 0;color:var(--dim);font-size:13px;line-height:1.4}
.close{margin-left:auto;background:none;border:1px solid var(--line-2);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;flex:none}
#p-content{display:flex;flex-direction:column;min-height:0;flex:1}
.floor-label{padding:12px 16px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-family:var(--f-mono)}
.desks{overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.desk{border:1px solid var(--line);border-radius:10px;background:rgba(6,8,26,.55);cursor:pointer;transition:border-color .15s,transform .15s}
.desk:hover{border-color:var(--line-2)}
.desk.error{border-color:rgba(255,79,109,.7)}
.desk-top{display:flex;gap:10px;align-items:center;padding:10px 12px}
.bot-face{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--deck);border:1px solid var(--line);flex:none}
.bot-face svg{width:24px;height:24px}
.desk h3{margin:0;font-size:15px;font-weight:600}
.desk .job{margin:2px 0 0;font-size:12.5px;color:var(--dim)}
.status{margin-left:auto;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;flex:none}
.desk-body{padding:0 12px 10px 60px;font-family:var(--f-mono);font-size:12px;display:grid;gap:3px}
.desk-body span{color:var(--dim)}
.err{color:var(--bad)}
.actions{display:flex;gap:8px;padding:0 12px 12px 60px;flex-wrap:wrap}
.btn{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink);background:var(--deck);border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1404;font-weight:600}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible,.close:focus-visible,.back:focus-visible,.desk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.empty{padding:20px 16px;color:var(--dim);font-size:14px;line-height:1.55}
.empty b{color:var(--ink)}

.profile{overflow-y:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.p-status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(6,8,26,.55);font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.p-status .dot{width:10px;height:10px}
.p-status small{margin-left:auto;color:var(--dim);text-transform:none;letter-spacing:0;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(6,8,26,.4)}
.stat span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.stat b{font-weight:500;font-size:14px}
.stat.wide{grid-column:1/-1}
.p-actions{display:flex;gap:8px;flex-wrap:wrap}

.login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(90,70,220,.35),rgba(6,8,26,.96) 60%);padding:16px}
.login form{width:min(360px,100%);background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:16px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login img{width:64px;height:72px;object-fit:contain;margin:0 auto 4px;filter:drop-shadow(0 0 14px rgba(242,193,78,.5))}
.login h2{margin:0;font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.login h2 span{color:var(--gold)}
.login p{margin:0 0 4px;color:var(--dim);font-size:14px}
.login input{font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--night);color:var(--ink)}
.login .btn{justify-content:center;padding:11px}
.login .err{color:var(--bad);font-size:13px;min-height:1em}
@media (max-width:720px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.office:not(.focus) .panel{max-height:42%}
  .counts,.where{display:none}
  body.open .feed,body.open .hint{display:none}
  .brand{font-size:16px}.brand img{width:24px;height:28px}
  .vault{font-size:12px}
}
</style>
</head>
<body>
<div class="hud">
  <div class="brand"><img src="/lion.png" alt="">CR3W <span>City</span></div>
  <button class="back" id="back" type="button" aria-label="Back to the city">← City</button>
  <div class="where" id="where"></div>
  <div class="tag" id="live">Connecting…</div>
  <div class="counts" id="counts"></div>
  <div class="vault">Bot runs today <b id="runs">–</b></div>
</div>
<div class="login" id="login" hidden>
  <form id="login-form">
    <img src="/lion.png" alt="">
    <h2>CR3W <span>City</span></h2>
    <p>Enter your dashboard password.</p>
    <input type="password" id="pass" autocomplete="current-password" placeholder="Password" required>
    <button class="btn primary" type="submit">Enter the city</button>
    <div class="err" id="login-err"></div>
  </form>
</div>
<canvas id="scene" aria-label="3D city of business buildings. Tap a building to enter its office, then tap a bot to meet it."></canvas>
<div class="fade" id="fade"></div>
<div class="banner" id="banner" hidden></div>
<div class="feed" id="feed" aria-live="polite"></div>
<div class="hint" id="hint">Drag to look around · Tap a building to enter</div>
<aside class="panel" id="panel" hidden aria-label="Office">
  <div class="p-head">
    <div><div class="p-eyebrow" id="p-eyebrow"></div><h2 id="p-title"></h2><p id="p-sub"></p></div>
    <button class="close" id="close" aria-label="Back">×</button>
  </div>
  <div id="p-content"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ============================================================
//  CR3W City: a 3D control room for the CR3W bots
// ============================================================
const STATUS={
  running:{label:'Running',hex:0x2bd99a,css:'#2bd99a',line:'On the clock'},
  waiting:{label:'Manual',hex:0xffb547,css:'#ffb547',line:'Ready when you are'},
  error:{label:'Needs you',hex:0xff4f6d,css:'#ff4f6d',line:'Last run failed'},
  paused:{label:'Off',hex:0x7b82ab,css:'#7b82ab',line:'Off duty'}
};
const SMALL=matchMedia('(max-width:720px)').matches;
const LOW=SMALL||(navigator.hardwareConcurrency||8)<=4;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
let BIZ=[],RUNS=0,mode='city',currentBiz=null,focusBot=null;

// ---------- renderer ----------
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,LOW?1.5:2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const camera=new THREE.PerspectiveCamera(50,1,.1,400);

// ---------- small helpers ----------
let seed=20260;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const hexCss=n=>'#'+n.toString(16).padStart(6,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;t.userData={canvas:c,g};return t}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function roundShape(w,d,r){const s=new THREE.Shape(),x=-w/2,y=-d/2;r=Math.min(r,w/2-.001,d/2-.001);
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+d-r);s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d);s.quadraticCurveTo(x,y+d,x,y+d-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
// rounded box standing on y=0
function rbox(w,h,d,r){const g=new THREE.ExtrudeGeometry(roundShape(w,d,r),{depth:h,bevelEnabled:false,curveSegments:8});g.rotateX(-Math.PI/2);return g}
function scaleUV(geo,su,sv){const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);return geo}
function mesh(geo,mat,shadow=true){const m=new THREE.Mesh(geo,mat);if(shadow){m.castShadow=true;m.receiveShadow=true}return m}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- environment (soft reflections) ----------
const SKY_VS='varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
const SKY_FS=`uniform vec3 top;uniform vec3 hor;uniform vec3 bot;uniform vec3 glow;varying vec3 vP;
void main(){float h=vP.y;vec3 c=h>0.0?mix(hor,top,pow(clamp(h,0.,1.),.55)):mix(hor*.35,bot,pow(clamp(-h,0.,1.),.35));
float g=exp(-abs(h)*9.0)*.55;c+=glow*g;gl_FragColor=vec4(c,1.0);}`;
function skyMat(top,hor,bot,glow){return new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:new THREE.Color(top)},hor:{value:new THREE.Color(hor)},bot:{value:new THREE.Color(bot)},glow:{value:new THREE.Color(glow)}},vertexShader:SKY_VS,fragmentShader:SKY_FS})}
// A painted night panorama (gradient sky + soft light panels) turned into reflections.
const ENV=(()=>{const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#141e5c');gr.addColorStop(.42,'#4a3aa8');gr.addColorStop(.5,'#c79cff');gr.addColorStop(.56,'#2a1f5e');gr.addColorStop(1,'#05060f');
  g.fillStyle=gr;g.fillRect(0,0,1024,512);
  const soft=(x,y,w,h,col,blur)=>{g.save();g.filter='blur('+blur+'px)';g.fillStyle=col;g.fillRect(x,y,w,h);g.restore()};
  soft(380,60,260,60,'#ffffff',14);soft(80,170,160,50,'#b6a6ff',12);soft(760,180,150,44,'#7fe3ff',12);soft(560,300,180,26,'#ffc86b',10);soft(0,0,1024,30,'#2a3a9a',20);
  const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
  const pm=new THREE.PMREMGenerator(renderer);const env=pm.fromEquirectangular(t).texture;pm.dispose();t.dispose();return env})();

// ---------- shared materials ----------
const M={
  shell:new THREE.MeshStandardMaterial({color:0xeef1f8,metalness:.18,roughness:.26,envMap:ENV,envMapIntensity:1.1}),
  pearl:new THREE.MeshStandardMaterial({color:0xd9deea,metalness:.35,roughness:.3,envMap:ENV}),
  metal:new THREE.MeshStandardMaterial({color:0xb8bfd0,metalness:.95,roughness:.22,envMap:ENV}),
  graphite:new THREE.MeshStandardMaterial({color:0x1a1e2e,metalness:.6,roughness:.35,envMap:ENV}),
  black:new THREE.MeshStandardMaterial({color:0x07080f,metalness:.4,roughness:.2,envMap:ENV}),
  wood:new THREE.MeshStandardMaterial({color:0xc99a68,metalness:0,roughness:.55,envMap:ENV,envMapIntensity:.5}),
  green:new THREE.MeshStandardMaterial({color:0x2e8a5a,roughness:.8,envMap:ENV,envMapIntensity:.3})
};
Object.values(M).forEach(m=>m.userData.shared=true);
const glowMats={};
function glow(hex,op=1){const k=hex+'_'+op;if(!glowMats[k]){glowMats[k]=new THREE.MeshBasicMaterial({color:hex,transparent:op<1,opacity:op,toneMapped:false});glowMats[k].userData.shared=true}return glowMats[k]}
function addGlow(hex,op){const m=new THREE.MeshBasicMaterial({color:hex,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,side:THREE.DoubleSide});return m}

// window textures for glass towers
function windowTex(tint,density){return ctex(128,256,(g,w,h)=>{g.fillStyle='#03050d';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=16){g.fillStyle='rgba(150,170,255,.10)';g.fillRect(0,y,w,1);
    for(let x=0;x<w;x+=8){if(rnd()<density){g.globalAlpha=.45+rnd()*.55;g.fillStyle=rnd()<.78?tint:'#ffd59a';g.fillRect(x+1,y+4,6,9)}}g.globalAlpha=1}})}
const WIN=[windowTex('#cfdcff',.42),windowTex('#9fe8ff',.38),windowTex('#e3d4ff',.46)];
WIN.forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping});
const glassMats=WIN.map(t=>{const m=new THREE.MeshStandardMaterial({color:0x26336e,map:t,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.85,metalness:.7,roughness:.12,envMap:ENV,envMapIntensity:1.2});m.userData.shared=true;return m});

// the lion
const lionTex=new THREE.TextureLoader().load('/lion.png');lionTex.encoding=THREE.sRGBEncoding;
function lionHolo(size,color=0xf2c14e){
  const g=new THREE.Group();
  const front=new THREE.Mesh(new THREE.PlaneGeometry(size*.88,size),new THREE.MeshBasicMaterial({map:lionTex,color,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,toneMapped:false}));
  g.add(front);
  const halo=new THREE.Mesh(new THREE.RingGeometry(size*.62,size*.66,64),addGlow(color,.55));g.add(halo);
  const cone=new THREE.Mesh(new THREE.CylinderGeometry(size*.55,.05,size*1.1,32,1,true),addGlow(color,.08));cone.position.y=-size*.95;g.add(cone);
  g.userData.spin=front;return g}

// labels (canvas sprites)
function labelTex(text,sub,colorCss,dotCss){return ctex(512,160,(g,w,h)=>{
  const grd=g.createLinearGradient(0,0,0,h);grd.addColorStop(0,'rgba(20,26,70,.94)');grd.addColorStop(1,'rgba(8,11,32,.94)');
  g.fillStyle=grd;rr(g,8,10,496,140,22);g.fill();g.strokeStyle='rgba(170,180,255,.35)';g.lineWidth=2;g.stroke();
  g.fillStyle=colorCss;rr(g,8,10,10,140,5);g.fill();
  g.fillStyle='#f1f2ff';g.font='700 50px "Chakra Petch", sans-serif';g.textAlign='center';g.fillText(text,264,74);

function animateRobots(t,dt){
  Object.values(O.robots).forEach(R=>{
    const st=R.bot.status,rob=R.rob,p=R.phase,L=rob.arms.L,Rt=rob.arms.R,focus=focusBot===R.bot.id;
    R.face+=((focus?1:0)-R.face)*Math.min(1,dt*4);
    R.seat.rotation.y=Math.PI*(1-R.face);
    let shL=-.72,elL=-.6,shR=-.72,elR=-.6,zL=0,zR=0,headX=0,headY=0,torsoX=0;
    if(st==='running'){const k=Math.sin(t*14+p),k2=Math.sin(t*13+p+1.7);shL+=k*.05;elL+=k*.12;shR+=k2*.05;elR+=k2*.12;headX=.08+Math.sin(t*1.3+p)*.04;headY=Math.sin(t*.7+p)*.15}
    else if(st==='waiting'){shL=-.2;elL=-.35;shR=-.2;elR=-.35;headY=Math.sin(t*.6+p)*.55;headX=-.05}
    else if(st==='paused'){shL=.05;elL=-.15;shR=.05;elR=-.15;headX=.42;torsoX=.12}
    else if(st==='error'){shL=-.4;shR=-.4;zL=-2.3;zR=2.3;elL=-1.4;elR=-1.4;headX=.25;headY=Math.sin(t*2.2+p)*.25;R.alarm.rotation.y=t*6}
    if(R.face>.02){const f=R.face;shL=shL*(1-f)+(-.1)*f;elL=elL*(1-f)+(-.25)*f;zL*=1-f;headX*=1-f;headY*=1-f;torsoX*=1-f;
      zR=zR*(1-f)+2.55*f;shR=shR*(1-f)+(-.25)*f;elR=elR*(1-f)+(Math.sin(t*9)*.45-.2)*f}
    L.sh.rotation.set(shL,0,zL);L.el.rotation.set(elL,0,0);Rt.sh.rotation.set(shR,0,zR);Rt.el.rotation.set(elR,0,st==='error'&&R.face<.5?0:0);
    if(R.face>.02)Rt.el.rotation.z=Math.sin(t*9)*.5*R.face;
    rob.headPivot.rotation.set(headX,headY,0);rob.torso.rotation.x=torsoX;
    if(st==='error'){const on=Math.sin(t*9)>0;rob.eye.color.setHex(on?0xff4f6d:0x3a0a14)}
    else if(st==='paused')rob.eye.color.setHex(Math.sin(t*1.5+p)>.85?0x2a2f48:0x5a6290);
    else{const blink=((t+p*.37)%4)<.1;rob.eyes.forEach(e=>e.scale.y=blink?.2:1.25)}
    if(rob.gear.userData.dish)rob.gear.userData.dish.rotation.z=t*1.2;
    R.zz.position.y=2.1+((t*.4+p*.01)%1)*.35;R.zz.material.opacity=1-((t*.4+p*.01)%1);
    R.pad.material.opacity=.45+.25*Math.sin(t*2+p);
    R.lab.visible=!focusBot;
  });
}

let down=null,moved=0,pinch=null;const pointers=new Map();

  G.theta-=dx*.006;if(LIM[mode].theta)G.theta=clamp(G.theta,...LIM[mode].theta);G.phi=clamp(G.phi-dy*.004,...LIM[mode].phi);down={x:e.clientX,y:e.clientY}});

  return toggle+`<a class="btn" href="${esc(bot.editorUrl)}" target="_blank" rel="noopener">${bot.kind==='manual'?'Run in n8n':'Open in n8n'}</a>`}
function renderPanel(){
  const b=BIZ.find(x=>x.id===currentBiz);if(!b)return;
  const bot=focusBot&&b.bots.find(x=>x.id===focusBot);
  if(bot){const st=STATUS[bot.status];
    pEye.textContent=b.name+' · Desk';pTitle.textContent=bot.name;pSub.textContent=bot.job;
    pContent.innerHTML=`<div class="profile">
      <div class="p-status" style="border-color:${st.css}55"><span class="dot ${bot.status}"></span>${st.label}<small>${st.line}</small></div>
      <div class="stats"><div class="stat wide"><span>Schedule</span><b>${esc(bot.schedule)}</b></div>
        <div class="stat"><span>Today</span><b>${esc(bot.today)}</b></div><div class="stat"><span>Last run</span><b>${esc(bot.last)}</b></div></div>
      ${bot.err?`<div class="err">${esc(bot.err)}</div>`:''}
      <div class="p-actions">${botActions(bot)}<button class="btn" data-back="1">Back to office</button></div></div>`;return}
  pEye.textContent='Office floor';pTitle.textContent=b.name;pSub.textContent=b.sub;
  if(!b.bots.length){pContent.innerHTML=`<div class="empty"><b>No bots here yet.</b><br>The desks are set up and waiting. When you build a bot for this building in n8n and give it a name in <b>BOT_INFO</b>, it takes a seat here.</div>`;return}
  pContent.innerHTML=`<div class="floor-label">${b.bots.length} desks · tap a bot to meet it</div><div class="desks">${b.bots.map(bot=>{const st=STATUS[bot.status];
    return `<div class="desk ${bot.status}" data-bot="${esc(bot.id)}" tabindex="0" role="button" aria-label="Meet ${esc(bot.name)}">
      <div class="desk-top"><div class="bot-face">${face(st.css)}</div><div><h3>${esc(bot.name)}</h3><p class="job">${esc(bot.job)}</p></div><div class="status"><span class="dot ${bot.status}"></span>${st.label}</div></div>
      <div class="desk-body"><div><span>Schedule </span>${esc(bot.schedule)}</div><div><span>Today </span>${esc(bot.today)}</div><div><span>Last run </span>${esc(bot.last)}</div>${bot.err?`<div class="err">${esc(bot.err)}</div>`:''}</div>
      <div class="actions">${botActions(bot)}</div></div>`}).join('')}</div>`;
}
pContent.addEventListener('click',async e=>{
  if(e.target.closest('[data-back]')){unfocus();return}
  const btn=e.target.closest('button[data-a]');
  if(!btn){if(e.target.closest('a'))return;const d=e.target.closest('[data-bot]');if(d)focusOn(d.dataset.bot);return}
  btn.disabled=true;btn.textContent='Working…';
  try{const r=await api('/api/bots/'+encodeURIComponent(btn.dataset.id)+'/'+btn.dataset.a,{method:'POST'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');await load()}
  catch(err){showBanner('Could not change that bot: '+err.message);btn.disabled=false}
});
pContent.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-bot]')){e.preventDefault();focusOn(e.target.dataset.bot)}});

// ============================================================
//  DATA
// ============================================================
const live=document.getElementById('live'),banner=document.getElementById('banner');
let PASS='';try{PASS=localStorage.getItem('cr3w-pass')||''}catch{}
const loginBox=document.getElementById('login');
function api(url,opts={}){return fetch(url,{...opts,headers:{...(opts.headers||{}),'x-cr3w-pass':PASS}})}
document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();PASS=document.getElementById('pass').value;
  const r=await api('/api/city');
  if(r.status===401){document.getElementById('login-err').textContent='That password is not right. Try again.';return}
  try{localStorage.setItem('cr3w-pass',PASS)}catch{}
  loginBox.hidden=true;load();
});
function showBanner(msg){banner.textContent=msg;banner.hidden=false}
function counts(){const all=BIZ.flatMap(b=>b.bots);const n=s=>all.filter(x=>x.status===s).length;
  document.getElementById('counts').innerHTML=[['running','on'],['waiting','manual'],['error','need you']].map(([s,l])=>`<span class="chip"><span class="dot ${s}"></span>${n(s)} ${l}</span>`).join('')}
function renderFeed(feed){document.getElementById('feed').innerHTML=feed.slice(0,4).map(f=>`<div class="ev ${f.ok?'':'bad'}"><time>${esc(f.time)}</time>${esc(f.msg)}</div>`).join('')}
let built=false;
const fontsReady=Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),sleep(1800)]);
async function load(){
  try{
    const r=await api('/api/city');
    if(r.status===401){loginBox.hidden=false;live.textContent='Locked';live.className='tag';return}
    const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not reach n8n');
    await fontsReady;
    BIZ=j.businesses;RUNS=j.runsToday||0;banner.hidden=true;live.textContent=j.stale?'Delayed':'Live';live.className=j.stale?'tag':'tag live';
    document.getElementById('runs').textContent=RUNS;
    if(!built){buildSkyline();buildBusinesses();clearTrees();built=true}else refreshBusinesses();
    updateCounter();counts();renderFeed(j.feed||[]);
    if(mode==='office'){refreshOffice();renderPanel()}
  }catch(err){live.textContent='Offline';live.className='tag down';showBanner('Can\'t reach your bots right now. '+err.message)}
}
load();setInterval(load,60000);

// ============================================================
//  RENDER LOOP
// ============================================================
let offX=0,offY=0;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<720?60:48;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),T=0;
(function loop(now){requestAnimationFrame(loop);
  const dt=Math.min(.12,(now-last)/1000||.016);last=now;T+=REDUCE?dt*.25:dt;
  const v=view[mode],G=goal[mode];
  if(mode==='city'&&!down&&!REDUCE&&!pinch)G.theta+=dt*.035;
  for(const k of ['theta','phi','r','tx','ty','tz'])v[k]+=(G[k]-v[k])*Math.min(1,dt*4.2);
  // keep the scene centered in the space the panel leaves free
  const w=innerWidth,h=innerHeight,open=!panel.hidden;
  const tx=open&&!SMALL?Math.min(220,w*.16):0,ty=open&&SMALL?h*(document.body.classList.contains('focus')?.24:.17):0;
  offX+=(tx-offX)*Math.min(1,dt*5);offY+=(ty-offY)*Math.min(1,dt*5);
  if(Math.abs(offX)>.5||Math.abs(offY)>.5)camera.setViewOffset(w,h,offX,offY,w,h);else camera.clearViewOffset();
  applyCam(v);
  if(mode==='city'){cityAnims.forEach(f=>f(T));renderer.render(city,camera)}
  else if(O.scene){animateRobots(T,dt);O.anims.forEach(f=>f(T));renderer.render(O.scene,camera)}
})(performance.now());
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});</script>
